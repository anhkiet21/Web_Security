version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cps_db
      MYSQL_USER: cps
      MYSQL_PASSWORD: cps
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cps-network

  # ================================================================
  # PROMETHEUS - Thu thập metrics từ Spring Boot (OWASP A09)
  # UI: http://localhost:9090
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: cps_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - cps-network

  # ================================================================
  # ALERTMANAGER - Gửi cảnh báo qua email/webhook (OWASP A09)
  # UI: http://localhost:9093
  # ================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cps_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cps-network

volumes:
  mysql_data:
  prometheus_data:

networks:
  cps-network:
