services:
  mysql:
    image: mysql:8.0.33
    container_name: cps_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cps_db
      MYSQL_USER: cps_user
      MYSQL_PASSWORD: cps_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cps-network

  web:
    build: .
    container_name: cps_spring_app
    depends_on:
      - mysql
      - mailhog
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cps_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: cps_user
      SPRING_DATASOURCE_PASSWORD: cps_pass

      # MailHog SMTP configuration
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false

    volumes:
      - .:/app # Mount project source
      - ~/.m2:/root/.m2 # Cache Maven dependencies
    networks:
      - cps-network

  mailhog:
    image: mailhog/mailhog
    container_name: cps_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - cps-network

  # ================================================================
  # PROMETHEUS - Thu thập metrics từ Spring Boot app (OWASP A09)
  # Truy cập UI: http://localhost:9090
  # Scrape endpoint: http://web:8080/actuator/prometheus
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: cps_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - web
    networks:
      - cps-network

  # ================================================================
  # ALERTMANAGER - Nhận alert từ Prometheus, gửi email/webhook (OWASP A09)
  # Truy cập UI: http://localhost:9093
  # Cấu hình: monitoring/alertmanager.yml
  # ================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cps_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cps-network

volumes:
  mysql_data:
  prometheus_data:    # Lưu dữ liệu metrics 15 ngày


networks:
  cps-network:
