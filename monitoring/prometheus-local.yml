# prometheus-local.yml
# Dùng khi Spring Boot chạy trực tiếp trên máy host (không trong Docker).
# host.docker.internal trỏ từ container Docker ra máy host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      # host.docker.internal = IP của máy host nhìn từ trong Docker container
      - targets:
          - host.docker.internal:8080

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
