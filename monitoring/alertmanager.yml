# alertmanager.yml
# Cấu hình Alertmanager - nhận alert từ Prometheus và gửi thông báo.
#
# HƯỚNG DẪN THIẾT LẬP EMAIL:
#   1. Dùng Gmail: Tạo App Password tại https://myaccount.google.com/apppasswords
#   2. Thay 'your-gmail@gmail.com' và 'your-app-password' bên dưới
#   3. Thay 'admin@yourcompany.com' bằng email nhận cảnh báo
#
# HƯỚNG DẪN THIẾT LẬP WEBHOOK (Slack/Discord):
#   - Xem phần receivers: webhook-alert bên dưới
#   - Thay SLACK_WEBHOOK_URL bằng URL thực
#
# Sau khi thay đổi, chạy lại: docker compose up -d alertmanager

global:
  # Cấu hình SMTP (Gmail). Thay bằng thông tin thực trước khi deploy.
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'mythduy@gmail.com'
  smtp_auth_username: 'mythduy@gmail.com'
  smtp_auth_password: 'nhpq gniw qjjg ypnr'   # App Password, không phải mật khẩu Gmail thường
  smtp_require_tls: true

# Route: quyết định alert nào gửi đến receiver nào
route:
  # Mặc định gửi đến email-alert
  receiver: 'email-alert'
  group_by: ['alertname', 'severity']
  group_wait: 30s         # Chờ 30s để gom các alert cùng group
  group_interval: 5m      # Gửi tiếp nếu có alert mới sau 5m
  repeat_interval: 1h     # Gửi lại nếu alert vẫn còn firing sau 1h

  # Route riêng cho alert critical => gửi cả email lẫn webhook
  routes:
    - match:
        severity: critical
      receiver: 'email-and-webhook'
      repeat_interval: 15m   # Critical: repeat nhanh hơn

    - match:
        severity: warning
      receiver: 'email-alert'
      repeat_interval: 1h

# Định nghĩa các receivers
receivers:
  # ----------------------------------------------------------------
  # Email only
  # ----------------------------------------------------------------
  - name: 'email-alert'
    email_configs:
      - to: 'mythduy@gmail.com'
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        html: |
          <b>{{ range .Alerts }}
          Alert: {{ .Annotations.summary }}<br/>
          Mức độ: {{ .Labels.severity }}<br/>
          Chi tiết: {{ .Annotations.description }}<br/>
          Bắt đầu: {{ .StartsAt }}<br/>
          {{ end }}</b>
        send_resolved: true

  # ----------------------------------------------------------------
  # Email + Webhook (Slack/Discord) - dành cho CRITICAL
  # ----------------------------------------------------------------
  - name: 'email-and-webhook'
    email_configs:
      - to: 'mythduy@gmail.com'
        headers:
          Subject: '[CRITICAL] {{ .CommonAnnotations.summary }}'
        html: |
          <b>{{ range .Alerts }}
          Alert: {{ .Annotations.summary }}<br/>
          Chi tiết: {{ .Annotations.description }}<br/>
          {{ end }}</b>
        send_resolved: true
    # Webhook ví dụ Slack - bỏ comment và điền URL khi dùng
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     send_resolved: true

# Inhibit rules: tắt alert WARNING nếu CRITICAL cùng alertname đang firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
